{% extends "base.html" %}
{% block content %}
<div class="text-center section">
  <h2>התור נקבע בהצלחה!</h2>
  <p>תודה {{ name }} 💖</p>
  <p>מיכל תקבל עכשיו את פרטי התור שלך, ותיצור איתך קשר לאישור.</p>

  <div class="mt-4">
    <a href="{{ michal_link }}" class="btn btn-main mb-3" target="_blank">
      שליחת פרטי התור למיכל בוואטסאפ
    </a>

    <a href="{{ client_link }}" class="btn btn-main mb-3" target="_blank">
      שליחת אישור תור ללקוחה בוואטסאפ
    </a>

    <a href="{{ address_link }}" class="btn btn-outline-light mb-4" target="_blank">
      ניווט למיקום הקליניקה
    </a>

    <a href="{{ CLIENT_URL }}" class="btn btn-outline-secondary w-100 mb-3">כניסת לקוחה</a>
    <a href="{{ OWNER_URL }}" class="btn btn-outline-dark w-100">כניסת בעלים</a>
  </div>

  <a href="/" class="btn btn-link mt-4" style="color:#c2185b;">חזרה לדף הבית</a>
</div>
{% endblock %}
