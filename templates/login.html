{% extends "base.html" %}
{% block content %}

<div class="section text-center">
  <h2 class="mb-4" style="color:#c2185b;">התחברות למערכת</h2>

  <form method="post" class="mx-auto" style="max-width:300px;">
    <input class="form-control mb-3" type="password" name="password" placeholder="סיסמה">
    <button class="btn btn-main w-100">כניסה</button>
  </form>

  <p class="mt-3 text-danger">
    {% if title == "כניסה - שגיאה" %}
      סיסמה שגויה
    {% endif %}
  </p>
</div>

{% endblock %}
